  tokens de assets/css/tokens.css. Ver docs/diseno-pastel/README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f8fb}
a{color:#0b63b8}a:hover{color:#108dff}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #108dff;outline-offset:2px}

<div style="position: relative; min-height: 100vh; display: flex; flex-wrap: wrap; background: #f6f8fb; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #2f384f; letter-spacing: -0.01em; font-size: 14px; line-height: 20px">

<aside style="flex: 1 1 240px; box-sizing: border-box; background: #ffffff; border-right: 1px solid #dee2e6; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<div style="width: 36px; height: 36px; border-radius: 8px; background: #e4f1ff; display: flex; align-items: center; justify-content: center; color: #108dff">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="m9 16 2 2 4-4"></path></svg>
</div>
<div style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em">Agenda DAQ</div>
</div>
<nav aria-label="Secciones" style="display: flex; flex-direction: column; gap: 4px">
<a href="01-hoy.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #4a5a6b; text-decoration: none">Hoy</a>
<a href="02-contactos.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #4a5a6b; text-decoration: none">Contactos</a>
<a href="04-calendario.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #4a5a6b; text-decoration: none">Calendario</a>
<a href="05-notas.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #e4f1ff; color: #0b63b8; font-weight: 600; text-decoration: none">Notas</a>
</nav>
</aside>

<main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px; max-width: 1180px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.04em">Notas</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px">
<div style="height: 150px; border-radius: 8px; background: #e4f1ff; border: 1px solid #c9e3ff"></div>
<div style="height: 150px; border-radius: 8px; background: #e2f1ee; border: 1px solid #c4e2dc"></div>
<div style="height: 150px; border-radius: 8px; background: #fdeee4; border: 1px solid #f8d9c4"></div>
<div style="height: 130px; border-radius: 8px; background: #eee9f7; border: 1px solid #dcd2ee"></div>
<div style="height: 130px; border-radius: 8px; background: #fde8ef; border: 1px solid #f8cfdc"></div>
<div style="height: 130px; border-radius: 8px; background: #e2f1ee; border: 1px solid #c4e2dc"></div>
</div>
</main>

<div style="position: absolute; inset: 0; background: rgba(47, 56, 79, .35); display: flex; justify-content: center; align-items: flex-start; padding: 72px 16px 16px; box-sizing: border-box">
<div role="dialog" aria-label="Nota" style="width: 100%; max-width: 560px; border-radius: 8px; background: #fdeee4; box-shadow: 0 16px 48px rgba(9, 30, 66, .20); overflow: hidden">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid rgba(47, 56, 79, .08)">
<div role="radiogroup" aria-label="Color de la nota" style="display: flex; gap: 8px">

<button type="button" role="radio" aria-checked="false" aria-label="Celeste" style="width: 30px; height: 30px; border-radius: 50%; background: #e4f1ff; border: 1px solid rgba(47, 56, 79, .15); box-shadow: none"></button>

<button type="button" role="radio" aria-checked="true" aria-label="Durazno" style="width: 30px; height: 30px; border-radius: 50%; background: #fdeee4; border: 2px solid #e77636; box-shadow: 0 0 0 3px #ffffff"></button>

<button type="button" role="radio" aria-checked="false" aria-label="Lavanda" style="width: 30px; height: 30px; border-radius: 50%; background: #eee9f7; border: 1px solid rgba(47, 56, 79, .15); box-shadow: none"></button>

<button type="button" role="radio" aria-checked="false" aria-label="Menta" style="width: 30px; height: 30px; border-radius: 50%; background: #e2f1ee; border: 1px solid rgba(47, 56, 79, .15); box-shadow: none"></button>

<button type="button" role="radio" aria-checked="false" aria-label="Rosa" style="width: 30px; height: 30px; border-radius: 50%; background: #fde8ef; border: 1px solid rgba(47, 56, 79, .15); box-shadow: none"></button>

</div>
<div style="margin-left: auto; display: flex; gap: 6px">
<button type="button" aria-pressed="false" aria-label="Fijar nota" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: #ffffff; color: #4a5a6b"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg></button>
<a href="05-notas.html" aria-label="Cerrar" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #ffffff; color: #4a5a6b"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
</div>
</div>

<div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Título</span>
<input type="text" value="Llamar después de las 18" style="border: 0; outline: none; background: transparent; padding: 0; font: inherit; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.03em; color: #2f384f">
</label>
<label style="display: flex; flex-direction: column">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Texto de la nota</span>
<textarea rows="5" style="border: 0; outline: none; background: transparent; padding: 0; resize: vertical; font: inherit; font-size: 16px; line-height: 24px; color: #2f384f">Trabaja de mañana y tarde. Prefiere WhatsApp antes de la llamada.
Si no contesta, probar el sábado a la mañana.</textarea>
</label>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 8px; background: rgba(255, 255, 255, .7)">
<div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #4a5a6b">Contacto</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #963b68; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">MG</div>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600">Mariana Gómez</div><div class="tabular" style="font-size: 12px; line-height: 16px; color: #4a5a6b">381 555-0142 · En seguimiento</div></div>
<a href="03-ficha-contacto.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: 13px; font-weight: 600; text-decoration: none">Abrir ficha</a>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #4a5a6b">Recordarme</div>
<div role="radiogroup" aria-label="Recordatorio" style="display: flex; flex-wrap: wrap; gap: 8px">

<button type="button" role="radio" aria-checked="true" style="min-height: 36px; padding: 0 12px; border-radius: 4px; font-size: 13px; border: 1px solid #108dff; background: #ffffff; color: #0b63b8; font-weight: 700;">Hoy 18:00</button>

<button type="button" role="radio" aria-checked="false" style="min-height: 36px; padding: 0 12px; border-radius: 4px; font-size: 13px; border: 1px solid rgba(47, 56, 79, .15); background: rgba(255, 255, 255, .6); color: #2f384f; font-weight: 500;">Mañana 9:00</button>

<button type="button" role="radio" aria-checked="false" style="min-height: 36px; padding: 0 12px; border-radius: 4px; font-size: 13px; border: 1px solid rgba(47, 56, 79, .15); background: rgba(255, 255, 255, .6); color: #2f384f; font-weight: 500;">Sábado 10:00</button>

<button type="button" role="radio" aria-checked="false" style="min-height: 36px; padding: 0 12px; border-radius: 4px; font-size: 13px; border: 1px solid rgba(47, 56, 79, .15); background: rgba(255, 255, 255, .6); color: #2f384f; font-weight: 500;">Sin recordatorio</button>

</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid rgba(47, 56, 79, .08)">
<span class="tabular" style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #4a5a6b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#287f71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Guardado · editada hoy 9:12</span>
<button type="button" style="margin-left: auto; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #b3204f; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Eliminar</button>
<a href="05-notas.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 8px; background: #108dff; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none">Listo</a>
</div>
</div>
</div>
</div>
