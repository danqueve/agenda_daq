<!doctype html>
<html lang="es">
<head>

<title>Agenda DAQ · Nota en el celular</title>
<!--

  No es código de producción: los datos son de ejemplo y no hay Alpine.
  Copiá de acá los valores exactos (colores, tamaños, espaciados, radios, sombras,

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0b63b8}a:hover{color:#108dff}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #108dff;outline-offset:2px}
.tabular{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #fdeee4; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #2f384f; letter-spacing: -0.01em; font-size: 14px; line-height: 20px">

<header style="flex: none; height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
<a href="05-notas.html" style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; font-size: 16px; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Notas</a>
<button type="button" aria-pressed="true" aria-label="Fijar nota" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #108dff; color: #ffffff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg></button>
<a href="05-notas.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 10px; font-size: 16px; font-weight: 700; text-decoration: none">Listo</a>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div class="tabular" style="font-size: 12px; line-height: 16px; color: #4a5a6b">Editada hoy 9:12 · Guardado</div>
<label style="display: flex; flex-direction: column">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Título</span>
<input type="text" value="Llamar después de las 18" style="border: 0; outline: none; background: transparent; padding: 0; font: inherit; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.03em; color: #2f384f">
</label>
<label style="display: flex; flex-direction: column">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Texto de la nota</span>
<textarea rows="6" style="border: 0; outline: none; background: transparent; padding: 0; resize: none; font: inherit; font-size: 17px; line-height: 26px; color: #2f384f">Trabaja de mañana y tarde. Prefiere WhatsApp antes de la llamada.
Si no contesta, probar el sábado a la mañana.</textarea>
</label>

<a href="03c-ficha-contacto-celular.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, .75); color: #2f384f; text-decoration: none">
<div style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #963b68; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">MG</div>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600">Mariana Gómez</div><div class="tabular" style="font-size: 12px; line-height: 16px; color: #4a5a6b">381 555-0142 · En seguimiento</div></div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8c98a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #4a5a6b">Recordarme</div>
<div role="radiogroup" aria-label="Recordatorio" style="display: flex; flex-wrap: wrap; gap: 8px">

<button type="button" role="radio" aria-checked="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; border: 1px solid #108dff; background: #ffffff; color: #0b63b8; font-weight: 700;">Hoy 18:00</button>

<button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; border: 1px solid rgba(47, 56, 79, .15); background: rgba(255, 255, 255, .6); color: #2f384f; font-weight: 500;">Mañana 9:00</button>

<button type="button" role="radio" aria-checked="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; border: 1px solid rgba(47, 56, 79, .15); background: rgba(255, 255, 255, .6); color: #2f384f; font-weight: 500;">Sin recordatorio</button>

</div>
</div>
</div>

<div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 30px; background: rgba(255, 255, 255, .85); border-top: 1px solid rgba(47, 56, 79, .08)">
<div role="radiogroup" aria-label="Color de la nota" style="display: flex; gap: 10px">

<button type="button" role="radio" aria-checked="false" aria-label="Celeste" style="width: 32px; height: 32px; border-radius: 50%; background: #e4f1ff; border: 1px solid rgba(47, 56, 79, .15)"></button>

<button type="button" role="radio" aria-checked="true" aria-label="Durazno" style="width: 32px; height: 32px; border-radius: 50%; background: #fdeee4; border: 2px solid #e77636"></button>

<button type="button" role="radio" aria-checked="false" aria-label="Lavanda" style="width: 32px; height: 32px; border-radius: 50%; background: #eee9f7; border: 1px solid rgba(47, 56, 79, .15)"></button>

<button type="button" role="radio" aria-checked="false" aria-label="Menta" style="width: 32px; height: 32px; border-radius: 50%; background: #e2f1ee; border: 1px solid rgba(47, 56, 79, .15)"></button>

<button type="button" role="radio" aria-checked="false" aria-label="Rosa" style="width: 32px; height: 32px; border-radius: 50%; background: #fde8ef; border: 1px solid rgba(47, 56, 79, .15)"></button>

</div>
<button type="button" aria-label="Eliminar nota" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #fde8ef; color: #b3204f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
</div>
</div>
</body>
</html>
