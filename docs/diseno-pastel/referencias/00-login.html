<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda DAQ · Iniciar sesión</title>
<!--
  REFERENCIA VISUAL ESTÁTICA · Agenda DAQ diseño pastel
  No es código de producción: los datos son de ejemplo y no hay Alpine.
  Copiá de acá los valores exactos (colores, tamaños, espaciados, radios, sombras,
  estructura) y llevalos a las clases de assets/css/components.css usando los
  tokens de assets/css/tokens.css. Ver docs/diseno-pastel/README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f8fb}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #108dff;outline-offset:2px}
</style>
</head>
<body>
<main style="min-height: 100vh; box-sizing: border-box; padding: 48px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #f6f8fb; font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #2f384f; letter-spacing: -0.01em; font-size: 14px; line-height: 20px; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<div style="position: absolute; top: 8%; left: 10%; width: 180px; height: 120px; border-radius: 16px; background: #fdeee4; border: 1px solid #f8d9c4; transform: rotate(-8deg)"></div>
<div style="position: absolute; top: 14%; right: 12%; width: 150px; height: 110px; border-radius: 16px; background: #eee9f7; border: 1px solid #dcd2ee; transform: rotate(7deg)"></div>
<div style="position: absolute; bottom: 12%; left: 14%; width: 140px; height: 100px; border-radius: 16px; background: #e2f1ee; border: 1px solid #c4e2dc; transform: rotate(6deg)"></div>
<div style="position: absolute; bottom: 9%; right: 9%; width: 190px; height: 120px; border-radius: 16px; background: #fde8ef; border: 1px solid #f8cfdc; transform: rotate(-6deg)"></div>
</div>

<div style="position: relative; display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #e4f1ff; border: 1px solid #c9e3ff; color: #108dff; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="m9 16 2 2 4-4"></path></svg>
</div>
<span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Agenda DAQ</span>
</div>

<form style="position: relative; width: 100%; max-width: 380px; box-sizing: border-box; padding: 28px; border-radius: 8px; background: #ffffff; border: 1px solid #dee2e6; box-shadow: 0 16px 48px rgba(9, 30, 66, .12); display: flex; flex-direction: column; gap: 18px">
<div>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.04em">Iniciar sesión</h1>
<p style="margin: 4px 0 0; color: #4a5a6b">Tu agenda de consultas y recontactos.</p>
</div>
<p role="alert" style="margin: 0; padding: 10px 12px; border-radius: 8px; background: #fde8ef; color: #b3204f; font-size: 13px; line-height: 18px; font-weight: 600">Usuario o contraseña incorrectos. Probá de nuevo.</p>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #4a5a6b">Usuario</span>
<input type="text" autocomplete="username" value="alejandro" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #108dff; box-shadow: 0 0 0 4px rgba(16, 141, 255, .18); border-radius: 4px; background: #ffffff; font: inherit; font-size: 16px; color: #2f384f; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #4a5a6b">Contraseña</span>
<span style="position: relative; display: flex">
<input type="password" autocomplete="current-password" value="secreto123" style="flex: 1; min-height: 48px; box-sizing: border-box; padding: 0 48px 0 14px; border: 1px solid #dee2e6; border-radius: 4px; background: #f0f4f7; font: inherit; font-size: 16px; color: #2f384f; outline: none">
<button type="button" aria-label="Mostrar contraseña" aria-pressed="false" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; color: #4a5a6b; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</span>
</label>
<button type="submit" style="min-height: 48px; border: 0; border-radius: 8px; background: #108dff; color: #ffffff; font-size: 16px; font-weight: 600">Ingresar</button>
<p style="margin: 0; text-align: center; font-size: 12px; line-height: 16px; color: #4a5a6b">La sesión queda guardada en este dispositivo.</p>
</form>
</main>
</body>
</html>
