# ============================================================================
# Agenda DAQ — bloque para el .htaccess COMPARTIDO de public_html
# ============================================================================
# El VPS sirve todos los dominios desde el mismo public_html y no se puede
# asignar document root por dominio. Este bloque hace que el subdominio
# agenda.imperiocomercial.com.ar resuelva internamente contra la carpeta
# public_html/agenda_daq/ sin cambiar la URL que ve el navegador (sin /agenda_daq/
# visible), para que rutas como /sw.js y /manifest.webmanifest funcionen en la
# raíz del subdominio.
#
# DÓNDE VA: pegarlo en public_html/.htaccess, DESPUÉS de "RewriteEngine On" y
# ANTES de cualquier regla general de reescritura de los otros sitios (las
# reglas de Apache se evalúan en orden y la primera que matchea con [L] corta
# la cadena; si esta va después de una regla general esa regla la va a
# interceptar primero y el subdominio nunca va a llegar a agenda_daq/).
# Si ya existen bloques de este mismo estilo para otros subdominios
# (por ejemplo el de "creditos"/"imperio"), este bloque puede ir inmediatamente
# después de esos, siempre que ninguno de ellos matchee también este HTTP_HOST.
# ============================================================================

RewriteCond %{HTTP_HOST} ^agenda\.imperiocomercial\.com\.ar$ [NC]
RewriteCond %{REQUEST_URI} !^/agenda_daq/
RewriteRule ^(.*)$ /agenda_daq/$1 [L]

# ============================================================================
# Verificación después de pegarlo (ver checklist completo en DEPLOY.md):
#   - https://agenda.imperiocomercial.com.ar/           -> login de Agenda DAQ
#   - https://agenda.imperiocomercial.com.ar/sw.js      -> el service worker
#     (Content-Type application/javascript), NO un 404 ni el index de otro sitio
#   - https://agenda.imperiocomercial.com.ar/manifest.webmanifest -> el manifest
#   - Los demás dominios/subdominios que comparten public_html siguen
#     funcionando igual que antes de agregar este bloque.
# ============================================================================
